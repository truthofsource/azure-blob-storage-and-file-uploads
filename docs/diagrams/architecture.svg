<text x="600.0" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Authorized upload</text>
<text x="600.0" y="266" text-anchor="middle" font-size="14" fill="#40556b">An applicant or staff member submits a</text>
<text x="600.0" y="284" text-anchor="middle" font-size="14" fill="#40556b">document.</text>
</g>
<g data-node="n1_0"><rect x="425.0" y="404" width="350" height="170" rx="7" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="416" data-purpose-icon="n1_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#315f8a" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#315f8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2" /><path d="m8 9-3 3 3 3m8-6 3 3-3 3m-3-7-2 8" /></g></svg>
<text x="600.0" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Functions API</text>
<text x="600.0" y="504" text-anchor="middle" font-size="14" fill="#40556b">Checks who may upload and where the file</text>
<text x="600.0" y="522" text-anchor="middle" font-size="14" fill="#40556b">belongs.</text>
</g>
<g data-node="n2_0"><rect x="233.0" y="642" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="654" data-purpose-icon="n2_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="5" rx="1" /><path d="M4 8v14h16V8M9 12h6m-6 4h6" /></g></svg>
<text x="408.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Private Blob storage</text>
<text x="408.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Holds the file privately while its safety</text>
<text x="408.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">check is pending.</text>
</g>
<g data-node="n2_1"><rect x="617.0" y="642" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="654" data-purpose-icon="n2_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h10l5 5v15H5V2Zm10 0v6h5M8 12h9m-9 4h9m-9 4h5" /></g></svg>
<text x="792.0" y="714" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Application records</text>
<text x="792.0" y="742" text-anchor="middle" font-size="14" fill="#40556b">Records who owns the file and its current</text>
<text x="792.0" y="760" text-anchor="middle" font-size="14" fill="#40556b">status.</text>
</g>
<g data-node="n3_0"><rect x="233.0" y="880" width="350" height="170" rx="7" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="390.0" y="892" data-purpose-icon="n3_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#996e23" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#996e23" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 2 7 3v5c0 4-7 8-7 8S2 14 2 10V5l7-3Z" /><circle cx="17" cy="16" r="4" /><path d="m20 19 3 3" /></g></svg>
<text x="408.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Malware-check pipeline</text>
<text x="408.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Scans the file and processes the reported</text>
<text x="408.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">result.</text>
</g>
<g data-node="n3_1"><rect x="617.0" y="880" width="350" height="170" rx="7" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="774.0" y="892" data-purpose-icon="n3_1"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#745386" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#745386" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3" /><path d="M2 20v-2a7 7 0 0 1 11-5m4-2 5 2v4c0 3-5 5-5 5s-5-2-5-5v-4l5-2Z" /></g></svg>
<text x="792.0" y="952" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Record-level access</text>
<text x="792.0" y="980" text-anchor="middle" font-size="14" fill="#40556b">Checks whether this person may open this</text>
<text x="792.0" y="998" text-anchor="middle" font-size="14" fill="#40556b">record.</text>
</g>
<g data-node="n4_0"><rect x="425.0" y="1118" width="350" height="170" rx="7" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<svg width="36" height="36" viewBox="0 0 40 40" x="582.0" y="1130" data-purpose-icon="n4_0"><rect x="1" y="1" width="38" height="38" rx="8" fill="white" stroke="#527a50" stroke-opacity="0.3" /><g transform="translate(8 8)" fill="none" stroke="#527a50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h10l5 5v15H5V2Zm10 0v6h5M8 12h9m-9 4h9m-9 4h5" /></g></svg>
<text x="600.0" y="1190" text-anchor="middle" font-size="16" font-weight="700" fill="#20384f">Protected preview / download</text>
<text x="600.0" y="1218" text-anchor="middle" font-size="14" fill="#40556b">Opens the file only when safety and access</text>
<text x="600.0" y="1236" text-anchor="middle" font-size="14" fill="#40556b">checks pass.</text>
</g>
