<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1444" viewBox="0 0 1200 1444" role="img" aria-labelledby="title desc">
<title id="title">Blob storage and file uploads — illustrated architecture</title>
<desc id="desc">Actual upload, ownership and protected-read boundaries. Storage account, container and blob are different levels. Storage acceptance alone does not make a file downloadable.</desc>
